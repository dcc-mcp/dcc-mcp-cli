name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      DCC_MCP_ADMIN_UI_PREBUILT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: native
            executable_suffix: ''
          - os: macos-latest
            platform: macos-universal2
            target: universal2
            executable_suffix: ''
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            executable_suffix: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Provide the Windows npm launcher for Core admin UI builds
        if: runner.os == 'Windows'
        uses: loonghao/vx@v0.9.34
        with:
          version: "0.9.34"
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::release tag $RELEASE_TAG does not match Cargo package version $cargo_version"
            exit 1
          fi
          echo "release identity validated: $RELEASE_TAG"
      - name: Pin Windows build to MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "x86_64-pc-windows-msvc"
          rustup target add $target
          "CARGO_BUILD_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hostTarget = (rustc -vV | Select-String "host:").ToString().Split(':', 2)[1].Trim()
          if ($hostTarget -ne $target) {
            throw "Expected $target, got $hostTarget"
          }
      - name: Build Linux or Windows binaries
        if: matrix.target == 'native' || runner.os == 'Windows'
        shell: bash
        run: |
          target_args=()
          output_dir="target/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            target_args=(--target x86_64-pc-windows-msvc)
            output_dir="target/x86_64-pc-windows-msvc/release"
          fi
          cargo build --release --locked "${target_args[@]}" -p dcc-mcp-cli --bin dccmcp --bin dcc-mcp-cli
          cp "$output_dir/dccmcp${{ matrix.executable_suffix }}" "dccmcp-${{ matrix.platform }}${{ matrix.executable_suffix }}"
          cp "$output_dir/dcc-mcp-cli${{ matrix.executable_suffix }}" "dcc-mcp-cli-${{ matrix.platform }}${{ matrix.executable_suffix }}"
      - name: Build macOS universal2 binaries
        if: matrix.target == 'universal2'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin -p dcc-mcp-cli --bin dccmcp --bin dcc-mcp-cli
          cargo build --release --locked --target aarch64-apple-darwin -p dcc-mcp-cli --bin dccmcp --bin dcc-mcp-cli
          lipo -create -output dccmcp-${{ matrix.platform }} target/x86_64-apple-darwin/release/dccmcp target/aarch64-apple-darwin/release/dccmcp
          lipo -create -output dcc-mcp-cli-${{ matrix.platform }} target/x86_64-apple-darwin/release/dcc-mcp-cli target/aarch64-apple-darwin/release/dcc-mcp-cli
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          python scripts/release/build_cli_bundle.py --version "$version" --platform "${{ matrix.platform }}" --cli-bin "dccmcp-${{ matrix.platform }}${{ matrix.executable_suffix }}" --name-prefix dccmcp --out-dir .
          python scripts/release/build_cli_bundle.py --version "$version" --platform "${{ matrix.platform }}" --cli-bin "dcc-mcp-cli-${{ matrix.platform }}${{ matrix.executable_suffix }}" --name-prefix dcc-mcp-cli --out-dir .
          python scripts/release/generate_update_manifest.py --version "$version" --platform "${{ matrix.platform }}" --release-tag "$RELEASE_TAG" --dccmcp-bin "dccmcp-${{ matrix.platform }}${{ matrix.executable_suffix }}" --compatibility-bin "dcc-mcp-cli-${{ matrix.platform }}${{ matrix.executable_suffix }}" --out-dir .
          python scripts/release/generate_asset_checksums.py --output "dcc-mcp-cli-release-checksums-${{ matrix.platform }}.txt" --asset "dccmcp-${{ matrix.platform }}${{ matrix.executable_suffix }}" --asset "dcc-mcp-cli-${{ matrix.platform }}${{ matrix.executable_suffix }}" --asset "dccmcp-${version}-${{ matrix.platform }}.zip" --asset "dcc-mcp-cli-${version}-${{ matrix.platform }}.zip" --asset "dcc-mcp-update-manifest-${{ matrix.platform }}.json"
      - name: Validate Windows WinGet archive
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = $env:RELEASE_TAG -replace '^v', ''
          $Archive = Join-Path $PWD "dccmcp-$Version-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $Archive)) {
            Write-Output "::error::WinGet archive was not created: $Archive"
            exit 1
          }

          $Extract = Join-Path $env:RUNNER_TEMP "winget-archive-$Version"
          Remove-Item -LiteralPath $Extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $Archive -DestinationPath $Extract
          $Files = @(Get-ChildItem -LiteralPath $Extract -Recurse -File)
          if ($Files.Count -ne 1 -or $Files[0].Name -ne 'dccmcp.exe' -or $Files[0].DirectoryName -ne $Extract) {
            $Names = $Files | ForEach-Object { $_.FullName }
            Write-Output "::error::WinGet archive must contain only root dccmcp.exe"
            $Names | ForEach-Object { Write-Output $_ }
            exit 1
          }

          $Output = (& $Files[0].FullName --version 2>&1 | Out-String)
          $Code = $LASTEXITCODE
          Write-Output $Output
          if ($Code -ne 0 -or [string]::IsNullOrWhiteSpace($Output) -or $Output -notmatch [regex]::Escape($Version)) {
            Write-Output "::error::dccmcp.exe --version failed or reported the wrong release"
            exit 1
          }
          Write-Output "WinGet archive validated: $Archive"
      - name: Package Python CLI wheel
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          python -m pip install "build>=1.2" "hatchling>=1.25" "wheel>=0.46"
          python scripts/release/generate_third_party_licenses.py --output pkg/dcc-mcp-cli-bin/THIRD_PARTY_LICENSES.txt
          python scripts/release/build_cli_wrapper_wheel.py --version "$version" --platform "$PLATFORM" --zip "dcc-mcp-cli-$version-$PLATFORM.zip" --out-dir dist
          python scripts/release/cli_wheel_tags.py retag --wheel-dir dist
          python scripts/release/cli_wheel_tags.py validate --wheel-dir dist --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dccmcp-${{ matrix.platform }}${{ matrix.executable_suffix }}
            dcc-mcp-cli-${{ matrix.platform }}${{ matrix.executable_suffix }}
            dccmcp-*.zip
            dcc-mcp-cli-*.zip
            dcc-mcp-update-manifest-${{ matrix.platform }}.json
            dcc-mcp-cli-release-checksums-${{ matrix.platform }}.txt
            *.sha256
            dist/*.whl

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # WinGet and Homebrew consume the standalone CLI release. Core owns the
  # gateway/server runtime and does not publish package-manager entries for the
  # CLI after the 0.21.0 repository split.
  check-winget-onboarding:
    name: Check WinGet package state
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.state.outputs.skip }}
      onboarded: ${{ steps.state.outputs.onboarded }}
    steps:
      - name: Check WinGet token
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_IDENTIFIER: DccMcp.DccMcpCli
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::warning::WINGET_TOKEN is not configured; skipping WinGet publication"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "onboarded=false" >> "$GITHUB_OUTPUT"
          else
            # A cross-organisation token that cannot read winget-pkgs also
            # returns 404. Probe a known package before trusting the target 404.
            control="manifests/m/Microsoft/PowerToys"
            control_status=0
            gh api "repos/microsoft/winget-pkgs/contents/$control" >/dev/null 2>control.err || control_status=$?
            if [ "$control_status" -ne 0 ]; then
              cat control.err
              echo "::error::cannot read winget-pkgs with the configured token"
              exit 1
            fi

            path="manifests/d/DccMcp/DccMcpCli"
            package_status=0
            gh api "repos/microsoft/winget-pkgs/contents/$path" >/dev/null 2>winget-api.err || package_status=$?
            if [ "$package_status" -eq 0 ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "onboarded=true" >> "$GITHUB_OUTPUT"
            elif grep -q 'HTTP 404' winget-api.err; then
              query="repo:microsoft/winget-pkgs is:pr is:open \"${WINGET_IDENTIFIER}\""
              existing_status=0
              existing="$(gh api search/issues --method GET \
                --field q="$query" \
                --field per_page=100 \
                --jq '.items[] | [.number, .html_url, .title] | @tsv')" || existing_status=$?
              if [ "$existing_status" -ne 0 ]; then
                echo "::error::could not determine whether a WinGet pull request is already open"
                exit 1
              fi
              if [ -n "$existing" ]; then
                echo "::warning::an open WinGet pull request already exists; skipping this release's WinGet submission"
                echo "$existing"
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              echo "onboarded=false" >> "$GITHUB_OUTPUT"
            else
              cat winget-api.err
              echo "::error::could not determine WinGet onboarding state"
              exit 1
            fi
          fi

  publish-winget-first:
    name: Publish first WinGet manifest
    needs: [build, check-winget-onboarding]
    if: needs.check-winget-onboarding.outputs.skip != 'true' && needs.check-winget-onboarding.outputs.onboarded == 'false'
    uses: ./.github/workflows/winget-first-manifest.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
      dry_run: false
    secrets: inherit

  publish-winget:
    name: Publish WinGet update
    needs: [build, check-winget-onboarding]
    if: needs.check-winget-onboarding.outputs.skip != 'true' && needs.check-winget-onboarding.outputs.onboarded == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    concurrency:
      group: winget-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    env:
      WINGET_IDENTIFIER: DccMcp.DccMcpCli
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Derive the release version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Refuse to duplicate an open WinGet pull request
        id: existing_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          query="repo:microsoft/winget-pkgs is:pr is:open \"${WINGET_IDENTIFIER}\" \"${version}\""
          existing="$(gh api search/issues --method GET \
            --field q="$query" \
            --field per_page=100 \
            --jq '.items[] | [.number, .html_url, .title] | @tsv')"
          if [ -n "$existing" ]; then
            echo "::error::An open WinGet pull request already exists for $WINGET_IDENTIFIER. Refusing a duplicate update."
            echo "$existing"
            echo "::error::Resolve or close the existing pull request before retrying this release."
            exit 1
          fi
      - name: Publish to WinGet
        uses: dcc-mcp/winget-releaser@d1b420769e4f42cdaf1990aee944be5076a524ca
        with:
          identifier: ${{ env.WINGET_IDENTIFIER }}
          fork-user: loonghao
          release-tag: ${{ env.RELEASE_TAG }}
          version: ${{ steps.version.outputs.version }}
          installers-regex: 'dccmcp-.*-windows-x86_64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  publish-homebrew:
    name: Publish Homebrew tap formula
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TAP_REPOSITORY: dcc-mcp/homebrew-tap
    steps:
      - name: Check Homebrew tap token
        id: check_token
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew publication"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.check_token.outputs.skip != 'true'
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.check_token.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - name: Download the macOS release asset
        if: steps.check_token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'dccmcp-macos-universal2' \
            --dir "$RUNNER_TEMP/dccmcp-release"
      - name: Generate and validate the formula
        if: steps.check_token.outputs.skip != 'true'
        shell: bash
        run: |
          asset="$RUNNER_TEMP/dccmcp-release/dccmcp-macos-universal2"
          version="${RELEASE_TAG#v}"
          sha256="$(sha256sum "$asset" | cut -d ' ' -f 1)"
          python scripts/release/generate_homebrew_formula.py \
            --version "$version" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/dccmcp-macos-universal2" \
            --sha256 "$sha256" \
            --output "$RUNNER_TEMP/dccmcp.rb"
          ruby -c "$RUNNER_TEMP/dccmcp.rb"
      - name: Update the Homebrew tap
        if: steps.check_token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/homebrew-tap"
          gh repo clone "$TAP_REPOSITORY" "$tap"
          gh auth setup-git
          mkdir -p "$tap/Formula"
          cp "$RUNNER_TEMP/dccmcp.rb" "$tap/Formula/dccmcp.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/dccmcp.rb; then
            echo "Homebrew formula already points at $RELEASE_TAG"
            exit 0
          fi
          git add Formula/dccmcp.rb
          git commit -m "chore: update dccmcp to ${RELEASE_TAG#v}"
          git push origin HEAD:main

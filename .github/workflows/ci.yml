name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    env:
      DCC_MCP_ADMIN_UI_PREBUILT: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: native
          - os: macos-latest
            target: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Provide the Windows npm launcher for Core admin UI builds
        if: runner.os == 'Windows'
        uses: loonghao/vx@v0.9.34
        with:
          version: "0.9.34"
      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: ${{ matrix.target != 'native' && matrix.target || '' }}
          components: rustfmt, clippy
      - name: Verify Windows uses MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostTarget = (rustc -vV | Select-String "host:").ToString().Split(':', 2)[1].Trim()
          if ($hostTarget -ne "x86_64-pc-windows-msvc") {
            throw "Expected x86_64-pc-windows-msvc, got $hostTarget"
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test release tooling
        run: python -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Test Python CLI wrapper
        run: |
          python -m pip install pytest "build>=1.2" "hatchling>=1.25" "wheel>=0.46"
          python scripts/release/generate_third_party_licenses.py --output pkg/dcc-mcp-cli-bin/THIRD_PARTY_LICENSES.txt
          python -m pytest pkg/dcc-mcp-cli-bin/tests -q
      - name: Build and test
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "native" ]; then
            cargo test -p dcc-mcp-cli --tests --locked -- --test-threads=1
            cargo clippy -p dcc-mcp-cli --all-targets --locked -- -D warnings
          else
            cargo test -p dcc-mcp-cli --tests --locked --target "${{ matrix.target }}" -- --test-threads=1
            cargo clippy -p dcc-mcp-cli --all-targets --locked --target "${{ matrix.target }}" -- -D warnings
          fi
      - name: Verify target Core compatibility and host install consent
        shell: bash
        run: |
          target=()
          if [ "${{ matrix.target }}" != "native" ]; then target=(--target "${{ matrix.target }}"); fi
          cargo test --locked -p dcc-mcp-cli "${target[@]}" --test cli_verify_e2e -- --ignored verify_reports_incompatible_target_core_after_combined_slice --exact
          set -o pipefail
          cargo test --locked -p dcc-mcp-cli "${target[@]}" --test cli_host_e2e -- install_never_announces_nothing_at_the_call_site --exact --nocapture 2>&1 | tee host-consent.log
          grep -Fx 'host-install-consent-gate exercised baseline=missing' host-consent.log
      - name: Verify command names
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "native" ]; then
            cargo run -p dcc-mcp-cli --locked --bin dccmcp -- --help
            cargo run -p dcc-mcp-cli --locked --bin dcc-mcp-cli -- --help
          else
            cargo run -p dcc-mcp-cli --locked --target "${{ matrix.target }}" --bin dccmcp -- --help
            cargo run -p dcc-mcp-cli --locked --target "${{ matrix.target }}" --bin dcc-mcp-cli -- --help
          fi
